# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'

# automatic restore
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @continuum-boot 'on'
set -g @continuum-restore 'on'

# change prefix
set-option -g prefix C-Space
bind-key C-Space last-window

# other config
set-option -g history-limit 5000

# --- pi: forward modified keys reliably + let pi receive the mouse wheel ---
set -g extended-keys on
set -g extended-keys-format csi-u
# smooth mouse scroll and auto-exit like native terminal
set -g mouse on
setw -g mode-keys vi
bind-key -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" "send-keys -M" "copy-mode -e ; send-keys -X -N 2 scroll-up"
bind-key -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; if-shell -F "#{==:#{scroll_position},0}" "send-keys -X cancel" "send-keys -X -N 2 scroll-down"
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X cancel
bind-key -T copy-mode-vi i send-keys -X cancel
bind-key -T copy-mode-vi a send-keys -X cancel
bind-key -T copy-mode WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind-key -T copy-mode WheelDownPane select-pane \; if-shell -F "#{==:#{scroll_position},0}" "send-keys -X cancel" "send-keys -X -N 2 scroll-down"
bind-key -T copy-mode MouseDown1Pane select-pane \; send-keys -X cancel
# toggle tmux mouse on/off with <prefix> m (tmux-mode-indicator shows the state)
bind m display-message "mouse: #{?mouse,on,off}" \; set -g mouse
set -g status-interval 1 # refresh the status line every second

set -g default-terminal "tmux-256color"
# let kitty graphics (inline images in omp) pass through tmux
set -g allow-passthrough on

bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R

bind-key b set-option status

# source theme
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-bg "#161616"
# source-file ~/.dotfiles/dots/tmux.theme.conf

# install tmux plugin manager if not exist
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
